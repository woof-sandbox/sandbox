name: Prettier Check

on:
  push:
    branches: [ dev, develop ]
  pull_request:
    branches: [ dev, develop ]

jobs:
  prettier-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'yarn'
        
    - name: Install dependencies
      run: yarn install --frozen-lockfile
      
    - name: Check TypeScript formatting
      run: yarn prettier:check
      
    - name: Check Solidity formatting
      run: npx prettier --check 'contracts/**/*.sol' --config .prettierrc.json
      
    - name: Check Prettier configuration
      run: |
        echo "Checking Prettier configuration..."
        npx prettier --config .prettierrc.json --check . 
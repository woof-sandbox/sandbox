name: CI

on:
  push:
    branches: [dev, develop]
  pull_request:
    branches: [dev, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ANKR_KEY: ${{ secrets.ANKR_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Generate TypeScript types
        run: npx typechain --target ethers-v5 

      - name: Compile contracts
        run: npx hardhat compile

      - name: TypeScript compilation check
        run: npx tsc --noEmit --project tsconfig.json

      - name: ESLint check
        run: yarn lint:ts

      - name: Solhint check
        run: yarn lint:sol

      - name: TypeScript Prettier check
        run: npx prettier --no-error-on-unmatched-pattern --check 'test/**/*.ts' 'src/**/*.ts' 'scripts/**/*.ts' 'hardhat.config.ts' --config .prettierrc.json --end-of-line auto

      - name: Solidity Prettier check
        run: npx prettier --check 'contracts/**/*.sol' --config .prettierrc.json --end-of-line auto

      - name: Run tests
        run: yarn test

      - name: Clean out directory
        run: yarn clean:out

  security:
    runs-on: ubuntu-latest
    env:
      ANKR_KEY: ${{ secrets.ANKR_KEY }}
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Slither
        run: |
          pip install slither-analyzer
          slither --version

      - name: Install Aderyn
        run: |
          yarn add @cyfrin/aderyn

      - name: Run Slither (if available)
        run: |
          if command -v slither &> /dev/null; then
            yarn slither
            echo "✅ Slither analysis completed"
          else
            echo "Slither not available, skipping..."
          fi
        continue-on-error: true

      - name: Upload Slither results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slither-results
          path: |
            SLITHER_REPORT.md
            slither-report.json
          retention-days: 30

      - name: Run Aderyn (if available)
        run: |
          if npx aderyn --version &> /dev/null; then
            yarn aderyn
            echo "✅ Aderyn analysis completed"
          else
            echo "Aderyn not available, skipping..."
          fi
        continue-on-error: true

      - name: Upload Aderyn results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aderyn-results
          path: ADERYN_REPORT.md
          retention-days: 30

name: CI

on:
  push:
    branches: [ dev, develop ]
  pull_request:
    branches: [ dev, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'yarn'
        
    - name: Install dependencies
      run: yarn install --frozen-lockfile
      
    - name: Run setup
      run: npm run setup
      
    - name: TypeScript compilation check
      run: npx tsc --noEmit
      
    - name: ESLint check
      run: yarn lint:ts
      
    - name: Solhint check
      run: yarn lint:sol
      
    - name: Prettier check
      run: yarn prettier:check
      
    - name: Solidity Prettier check
      run: npx prettier --check 'contracts/**/*.sol' --config .prettierrc.json
      
    - name: Run tests
      run: yarn test
      
    - name: Build contracts
      run: yarn build
      
    - name: Clean out directory
      run: yarn clean:out
      
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: test-results.json
        retention-days: 30

  security:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'yarn'
        
    - name: Install dependencies
      run: yarn install --frozen-lockfile
      
    - name: Run setup
      run: npm run setup
      
    - name: Build contracts for security analysis
      run: yarn build
      
    - name: Run Slither (if available)
      run: |
        if command -v slither &> /dev/null; then
          yarn slither
        else
          echo "Slither not available, skipping..."
        fi
      continue-on-error: true
      
    - name: Run Aderyn (if available)
      run: |
        if command -v aderyn &> /dev/null; then
          yarn aderyn
        else
          echo "Aderyn not available, skipping..."
        fi
      continue-on-error: true

  coverage:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'yarn'
        
    - name: Install dependencies
      run: yarn install --frozen-lockfile
      
    - name: Run setup
      run: npm run setup
      
    - name: Run tests with coverage
      run: yarn test:coverage
      
    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports
        path: coverage/
        retention-days: 30 
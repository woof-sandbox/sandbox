[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
solc = '0.8.28'
optimizer = true
optimizer_runs = 200
extra_output = ['storageLayout']
extra_output_files = ['storageLayout']
eth_rpc_url = 'https://sepolia.infura.io/v3/2bacc21f30d640a6b7784c1d6c7a3845'

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = 'long'
func_attrs_with_params_multiline = true
quote_style = 'double'
number_underscore = 'thousands'